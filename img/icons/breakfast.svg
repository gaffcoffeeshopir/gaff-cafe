<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- صبحانه — تابه با نیمرو -->
  <defs>
    <linearGradient id="pan" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#151515"/>
    </linearGradient>
    <radialGradient id="yolk" cx="58%" cy="48%" r="45%">
      <stop stop-color="#ffc14d"/>
      <stop offset="1" stop-color="#e8911a"/>
    </radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.8" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <ellipse cx="52" cy="108" rx="42" ry="7" fill="#1a2218" opacity="0.12"/>
    <ellipse cx="52" cy="62" rx="40" ry="38" fill="url(#pan)" stroke="#1a2218" stroke-width="2.4"/>
    <ellipse cx="52" cy="62" rx="32" ry="30" fill="#2a2a2a" stroke="#1a2218" stroke-width="1.5"/>
    <!-- handle -->
    <path d="M90 70c18 6 28 4 30-2" fill="none" stroke="#1a2218" stroke-width="7" stroke-linecap="round"/>
    <path d="M90 70c18 6 28 4 30-2" fill="none" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"/>
    <!-- egg white -->
    <path d="M38 48c-6 2-12 12-8 24 3 10 14 18 26 16 14-2 22-12 20-24-2-12-12-18-22-18-6 0-12 0-16 2z" fill="#fffef8" stroke="#1a2218" stroke-width="1.8"/>
    <ellipse cx="54" cy="62" rx="12" ry="11" fill="url(#yolk)" stroke="#c47a10" stroke-width="1.2"/>
    <ellipse cx="50" cy="58" rx="3.5" ry="2.5" fill="#ffe6a8" opacity="0.7"/>
  </g>
</svg>
