<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- چای — قوری و فنجان -->
  <defs>
    <linearGradient id="metal" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3f1ec"/>
      <stop offset="0.5" stop-color="#c8c4bc"/>
      <stop offset="1" stop-color="#9a958c"/>
    </linearGradient>
    <linearGradient id="tea" x1="70" y1="70" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c47a3a"/>
      <stop offset="1" stop-color="#8b4a1f"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.8" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <ellipse cx="60" cy="102" rx="40" ry="7" fill="#1a2218" opacity="0.1"/>
    <!-- teapot -->
    <ellipse cx="48" cy="58" rx="28" ry="26" fill="url(#metal)" stroke="#1a2218" stroke-width="2.2"/>
    <path d="M74 50c14 2 20 14 12 22" fill="none" stroke="#1a2218" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M22 52c-10 0-14 10-8 16" fill="none" stroke="#1a2218" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="40" y="28" width="16" height="10" rx="3" fill="url(#metal)" stroke="#1a2218" stroke-width="2"/>
    <path d="M44 28c0-8 8-12 12-8" fill="none" stroke="#1a2218" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="48" cy="42" rx="10" ry="4" fill="#fff" opacity="0.35"/>
    <!-- cup -->
    <path d="M78 78h22c1 0 2 1 2 2v8c0 8-6 14-14 14s-14-6-14-14v-8c0-1 1-2 2-2z" fill="url(#metal)" stroke="#1a2218" stroke-width="2"/>
    <ellipse cx="89" cy="78" rx="11" ry="4" fill="url(#tea)" stroke="#1a2218" stroke-width="1.4"/>
    <ellipse cx="89" cy="102" rx="16" ry="4" fill="url(#metal)" stroke="#1a2218" stroke-width="1.8"/>
    <path d="M102 82c6 1 8 6 5 10" fill="none" stroke="#1a2218" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
