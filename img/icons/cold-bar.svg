<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- بار سرد — لیوان یخ با نعناع -->
  <defs>
    <linearGradient id="glass" x1="40" y1="20" x2="85" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eaf4f7" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#b7cdd4" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="drink" x1="45" y1="45" x2="80" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3d2918"/>
      <stop offset="1" stop-color="#1a100a"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="1.8" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#s)">
    <ellipse cx="58" cy="108" rx="28" ry="6" fill="#1a2218" opacity="0.12"/>
    <path d="M40 38h40l-6 68c0 4-4 6-10 6h-8c-6 0-10-2-10-6l-6-68z" fill="url(#glass)" stroke="#1a2218" stroke-width="2.2"/>
    <path d="M44 48h32l-4.5 52c0 2-2 3-6 3h-7c-4 0-6-1-6-3L44 48z" fill="url(#drink)" opacity="0.92"/>
    <!-- ice -->
    <rect x="48" y="52" width="12" height="10" rx="2" fill="#d7eef5" stroke="#1a2218" stroke-width="1.2" opacity="0.9" transform="rotate(-12 54 57)"/>
    <rect x="62" y="58" width="11" height="9" rx="2" fill="#cfe8f0" stroke="#1a2218" stroke-width="1.2" opacity="0.85" transform="rotate(18 67 62)"/>
    <rect x="52" y="68" width="10" height="8" rx="2" fill="#e3f3f8" stroke="#1a2218" stroke-width="1.1" opacity="0.8" transform="rotate(-8 57 72)"/>
    <!-- straw -->
    <path d="M72 22l8 88" stroke="#e8d5a8" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M72 22l8 88" stroke="#1a2218" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.35"/>
    <!-- mint -->
    <ellipse cx="58" cy="34" rx="8" ry="4" fill="#6b9a5a" stroke="#1a2218" stroke-width="1.3" transform="rotate(-35 58 34)"/>
    <ellipse cx="66" cy="30" rx="7" ry="3.5" fill="#7fad68" stroke="#1a2218" stroke-width="1.3" transform="rotate(25 66 30)"/>
    <ellipse cx="62" cy="26" rx="6" ry="3" fill="#5d8a4e" stroke="#1a2218" stroke-width="1.2" transform="rotate(-5 62 26)"/>
  </g>
</svg>
