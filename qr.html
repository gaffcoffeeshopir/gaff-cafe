<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR منو | کافه گاف</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/local-fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="qr-page">
    <div class="bg-texture" aria-hidden="true"></div>

    <main class="qr-card">
      <p class="slogan">قهوه‌های کافه گاف رو بخوری دیگه گاف نمیدی ;)</p>
      <img
        class="logo logo-qr"
        src="img/logo.png?v=2"
        alt="کافه گاف — GAFF"
        width="220"
        height="270"
      />
      <h1>منوی دیجیتال</h1>
      <p class="qr-lead">اسکن کنید و سفارش دهید</p>
      <div class="qr-box" id="qrBox"></div>
      <p class="qr-url" id="qrUrl"></p>
      <p class="hint print-hide">این صفحه را چاپ کنید و روی میز بگذارید. فایل PNG آمادهٔ چاپ هم در پوشه img هست.</p>
      <div class="qr-links print-hide">
        <a href="img/gaff-menu-qr.png" download="gaff-menu-qr.png">دانلود QR (PNG)</a>
        <a href="https://gaff-cafe.onrender.com/">باز کردن منو</a>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
    <script src="js/qr.js"></script>
  </body>
</html>
