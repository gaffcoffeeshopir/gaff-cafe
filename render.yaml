services:
  - type: web
    name: gaff-cafe
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://gaff-cafe.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
