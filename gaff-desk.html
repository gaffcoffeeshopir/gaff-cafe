<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>مدیریت منو | گاف</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Vazirmatn:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="bg-texture" aria-hidden="true"></div>

    <section class="admin-login" id="loginView">
      <div class="admin-card">
        <p class="admin-brand">GAFF</p>
        <h1>مدیریت منو</h1>
        <p class="admin-lead">فقط برای مدیریت کافه</p>
        <label class="field">
          <span>رمز ورود</span>
          <input type="password" id="adminPassword" autocomplete="current-password" />
        </label>
        <button type="button" class="btn-primary" id="loginBtn">ورود</button>
        <p class="admin-error" id="loginError" hidden></p>
      </div>
    </section>

    <section class="admin-app" id="appView" hidden>
      <header class="admin-header">
        <div>
          <p class="admin-brand">GAFF Desk</p>
          <h1>ویرایش منو</h1>
        </div>
        <button type="button" class="btn-ghost" id="logoutBtn">خروج</button>
      </header>

      <div class="admin-grid">
        <form class="admin-card admin-form" id="addForm">
          <h2>محصول جدید</h2>
          <label class="field">
            <span>نام</span>
            <input type="text" id="newName" required placeholder="مثلاً لاته دارچین" />
          </label>
          <label class="field">
            <span>دسته‌بندی</span>
            <select id="newCategory"></select>
          </label>
          <label class="field">
            <span>قیمت (تومان)</span>
            <input type="number" id="newPrice" min="0" step="1000" required />
          </label>
          <label class="field">
            <span>توضیح (اختیاری)</span>
            <textarea id="newDesc" rows="2"></textarea>
          </label>
          <label class="check">
            <input type="checkbox" id="newHasSize" />
            <span>گزینه تک / دوبل داشته باشد</span>
          </label>
          <label class="field" id="newDeltaWrap" hidden>
            <span>مابه‌تفاوت دوبل (تومان)</span>
            <input type="number" id="newDelta" min="0" step="1000" value="40000" />
          </label>
          <button type="submit" class="btn-primary">افزودن محصول</button>
          <p class="admin-hint" id="addHint" hidden></p>
        </form>

        <div class="admin-card admin-list-wrap">
          <div class="admin-list-head">
            <h2>محصولات</h2>
            <select id="filterCategory">
              <option value="">همه دسته‌ها</option>
            </select>
          </div>
          <div class="admin-list" id="itemList"></div>
        </div>
      </div>
    </section>

    <script src="js/admin.js"></script>
  </body>
</html>
