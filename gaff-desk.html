<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#8fa37a" />
    <title>مدیریت منو | گاف</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/local-fonts.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body class="admin-body">
    <div class="bg-texture" aria-hidden="true"></div>

    <section class="admin-login" id="loginView">
      <div class="admin-card admin-login-card">
        <p class="admin-brand">GAFF</p>
        <h1>میز مدیریت</h1>
        <p class="admin-lead">ورود فقط برای مدیریت کافه</p>
        <label class="field">
          <span>رمز ورود</span>
          <input type="password" id="adminPassword" autocomplete="current-password" inputmode="text" />
        </label>
        <button type="button" class="btn-primary admin-full-btn" id="loginBtn">ورود</button>
        <p class="admin-error" id="loginError" hidden></p>
      </div>
    </section>

    <section class="admin-app" id="appView" hidden>
      <header class="admin-header">
        <div class="admin-header-text">
          <p class="admin-brand">GAFF Desk</p>
          <h1>مدیریت منو</h1>
        </div>
        <div class="admin-header-actions">
          <a class="btn-ghost admin-nav-link" href="/gaff-customers">مشتریان</a>
          <a class="btn-ghost admin-nav-link" href="/gaff-feedback">نظریات و انتقادات</a>
          <button type="button" class="btn-ghost admin-logout" id="logoutBtn">خروج</button>
        </div>
      </header>

      <p class="admin-persist-warn" id="persistHint" hidden></p>

      <div class="admin-stats" id="adminStats"></div>

      <div class="admin-cats-rail">
        <nav class="admin-cats" id="filterCats" aria-label="فیلتر دسته‌بندی"></nav>
        <p class="admin-cats-hint" aria-hidden="true">بکشید ← → همه دسته‌ها</p>
      </div>

      <details class="admin-card admin-add" id="catPanel">
        <summary class="admin-add-summary">
          <span>+ افزودن دسته‌بندی</span>
        </summary>
        <form class="admin-form" id="catForm">
          <label class="field">
            <span>نام دسته</span>
            <input type="text" id="catName" required placeholder="مثلاً اسموتی‌ها" />
          </label>

          <p class="field-label">استیکر دسته</p>
          <div class="sticker-pick" id="stickerPick" role="radiogroup" aria-label="انتخاب استیکر"></div>
          <input type="hidden" id="catIcon" />

          <label class="sticker-upload">
            <input type="file" id="stickerFile" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden />
            <span class="sticker-upload-btn">آپلود استیکر جدید</span>
            <span class="sticker-upload-hint">PNG، SVG، WebP یا JPG</span>
          </label>

          <button type="submit" class="btn-primary admin-full-btn">ثبت دسته‌بندی</button>
          <p class="admin-hint" id="catHint" hidden></p>
        </form>
      </details>

      <details class="admin-card admin-add" id="addPanel">
        <summary class="admin-add-summary">
          <span>+ افزودن محصول جدید</span>
        </summary>
        <form class="admin-form" id="addForm">
          <label class="field">
            <span>نام محصول</span>
            <input type="text" id="newName" required placeholder="مثلاً لاته دارچین" />
          </label>

          <p class="field-label">دسته‌بندی</p>
          <div class="cat-pick" id="newCategoryPick" role="radiogroup" aria-label="دسته‌بندی محصول"></div>
          <input type="hidden" id="newCategory" />

          <label class="field">
            <span>توضیح (اختیاری)</span>
            <textarea id="newDesc" rows="2" placeholder="مواد یا توضیح کوتاه"></textarea>
          </label>

          <label class="switch">
            <input type="checkbox" id="newHasSize" />
            <span class="switch-ui" aria-hidden="true"></span>
            <span class="switch-text">گزینه تک / دوبل</span>
          </label>

          <button type="submit" class="btn-primary admin-full-btn">ثبت محصول</button>
          <p class="admin-hint" id="addHint" hidden></p>
        </form>
      </details>

      <div class="admin-list-meta">
        <h2 id="listTitle">همه محصولات</h2>
        <span id="listCount"></span>
      </div>
      <div class="admin-list" id="itemList"></div>
    </section>

    <script src="js/admin.js"></script>
    <script src="js/scroll-rail.js"></script>
  </body>
</html>
